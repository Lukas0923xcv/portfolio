# nginx on the portfolio LXC (the origin behind Nginx Proxy Manager).
# Install:  sudo cp portfolio.conf /etc/nginx/sites-available/portfolio
#           sudo ln -sf /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/portfolio
#           sudo nginx -t && sudo systemctl reload nginx
# Brotli needs the brotli module (Debian: apt install libnginx-mod-http-brotli-static);
# without it, delete the two brotli lines and gzip_static still works.

server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name server-lukas.com;
    root /var/www/portfolio;
    index index.html;
    charset utf-8;

    # The build already compressed every text file: serve those directly.
    gzip_static on;
    brotli_static on;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;
    brotli on;
    brotli_types text/css application/javascript image/svg+xml application/xml text/plain application/json;

    # Security headers. The site loads nothing from other servers, so the policy can be strict.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # HTML: always check for a new version
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/portfolio-headers.conf;
        try_files $uri $uri/ =404;
    }

    # Hashed file names never change, so they can be cached for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/portfolio-headers.conf;
        try_files $uri =404;
    }

    location ~ ^/(og|cv)/ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/portfolio-headers.conf;
    }

    location = /status.json {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/portfolio-headers.conf;
    }

    location = /.well-known/security.txt { default_type text/plain; }

    # The old site had no /en/ pages; English 404s get the English page
    location /en/ {
        error_page 404 /en/404.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/portfolio-headers.conf;
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /en/404.html { internal; }

    # Never serve the deploy tooling or hidden files
    location ~ /(\.|_deploy) { deny all; return 404; }
}
