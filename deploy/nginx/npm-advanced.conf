# Nginx Proxy Manager: proxy host server-lukas.com → tab "Advanced" → paste this.
# In the "SSL" tab also switch on: Force SSL, HTTP/2 Support, and (once every
# subdomain serves HTTPS) HSTS Enabled. Leave "HSTS Subdomains" off until you are sure.
proxy_hide_header X-Powered-By;
more_clear_headers Server;   # needs headers-more; delete this line if NPM refuses the config
